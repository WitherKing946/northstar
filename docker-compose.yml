# North Star stack — demo + production DB
#
# Default (demo, no deps): `docker compose up --build` -> backend with SQLite
# Embedded AI is now inside the app — no Ollama container needed.
#
# With PostgreSQL: `docker compose --profile db up --build`
#   then set DATABASE_URL=postgresql+psycopg://northstar:northstar@db:5432/northstar

services:
  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/data/northstar.db}
      PORT: "8000"
    volumes:
      - db_data:/app/data
    depends_on:
      db:
        condition: service_healthy
        required: false

  db:
    image: postgres:16-alpine
    profiles: ["db"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: northstar
      POSTGRES_PASSWORD: northstar
      POSTGRES_DB: northstar
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U northstar -d northstar"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db_data:
  pg_data: